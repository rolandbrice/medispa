backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images
site_url: https://medi-spa-saly.sn
display_url: https://medi-spa-saly.sn

collections:
  - name: infos
    label: "1 · Infos générales"
    files:
      - name: site
        label: "Coordonnées & horaires"
        file: src/data/site.json
        fields:
          - { name: nom, label: "Nom", widget: string }
          - { name: baseline, label: "Baseline", widget: string }
          - { name: telephone, label: "Téléphone", widget: string }
          - { name: whatsapp, label: "Numéro WhatsApp (sans +)", widget: string, hint: "Ex : 221785951515" }
          - { name: email, label: "Email", widget: string }
          - { name: instagram, label: "Lien Instagram", widget: string }
          - { name: adresse, label: "Adresse", widget: string }
          - { name: horaires, label: "Horaires", widget: string }
          - { name: noteGoogle, label: "Note Google", widget: string }
          - { name: nbAvis, label: "Nombre d'avis", widget: string }
          - { name: ficheGoogle, label: "Lien fiche Google", widget: string }

  - name: catalogue
    label: "2 · Catalogue"
    files:
      - name: soins
        label: "Soins (5)"
        file: src/data/soins.json
        fields:
          - name: soins
            label: "Soins"
            widget: list
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: categorie, label: "Catégorie", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: image, label: "Photo", widget: image }
              - { name: duree, label: "Durée", widget: string }
              - { name: messageWhatsapp, label: "Message WhatsApp pré-rempli", widget: string }
      - name: rituels
        label: "Rituels / Forfaits (3)"
        file: src/data/rituels.json
        fields:
          - name: rituels
            label: "Rituels"
            widget: list
            fields:
              - { name: nom, label: "Nom", widget: string }
              - { name: duree, label: "Durée", widget: string }
              - { name: contenu, label: "Contenu", widget: text }
              - { name: prix, label: "Prix (FCFA)", widget: string }
              - { name: vedette, label: "Mettre en avant ?", widget: boolean, required: false }
